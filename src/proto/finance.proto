syntax = "proto3";

package finance;

service FinanceServiceGrpc {
  rpc RegisterAsset (FinanceRequest) returns (FinanceResponse);
  rpc GetAssetsWithDepreciation (FinanceRequest) returns (FinanceResponse);
  rpc CalculateLandedCost (FinanceRequest) returns (FinanceResponse);
  rpc AddLedgerEntry (FinanceRequest) returns (FinanceResponse);
  rpc GetLedger (FinanceRequest) returns (FinanceResponse);
}

message FinanceRequest {
  string tenantId = 1;
  string payloadJson = 2; // DTO ডেটা JSON স্ট্রিং হিসেবে পাস করতে
}

message FinanceResponse {
  bool success = 1;
  string message = 2;
  string dataJson = 3; // সার্ভিস থেকে আসা রেজাল্ট JSON আকারে রাখতে
}