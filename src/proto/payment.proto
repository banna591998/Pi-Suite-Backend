syntax = "proto3";

package payment;

service PaymentServiceGrpc {
  rpc Checkout (PaymentRequest) returns (PaymentResponse);
  rpc SetupGateway (PaymentRequest) returns (PaymentResponse);
  rpc CustomerCheckout (PaymentRequest) returns (PaymentResponse);
  rpc LinkStripeAccount (PaymentRequest) returns (PaymentResponse);
  rpc VerifyPayment (PaymentRequest) returns (PaymentResponse);
  rpc GetTenantSubscription (PaymentRequest) returns (PaymentResponse);
}

message PaymentRequest {
  string tenantId = 1;
  string payloadJson = 2; // DTO বা বডি ডেটা JSON স্ট্রিং হিসেবে পাস করতে
}

message PaymentResponse {
  bool success = 1;
  string message = 2;
  string dataJson = 3; // সার্ভিস থেকে আসা রেজাল্ট JSON আকারে রাখতে
}